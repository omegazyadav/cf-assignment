apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kuberay-operator
  namespace: argocd
  labels:
    tier: kuberay
spec:
  project: default
  source:
    repoURL: https://github.com/omegazyadav/cf-assignment.git
    targetRevision: master
    path: helm/kuberay-operator
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kuberay-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
